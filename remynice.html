<!DOCTYPE html>

    <style>

        }

        #hedlinecontainer {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 100px;
        }

        #shine {
        font-size: 80px;
        font-weight: bold;
        font-family: 'Dancing Script';
        color: rgba(244, 50, 68, 1);
        z-index: 10;
        animation: shine 3s infinite;
        -webkit-animation: shine 3s infinite;
        text-shadow: 0 0px 10px rgba(233, 85, 189, 0.6);
        }

        @keyframes shine {
        0%, 10% {
            text-shadow: 0 0px 5px rgba(233, 85, 189, 0.3);
        }
        50% {
            text-shadow: 0 0px 20px rgba(233, 85, 189, 0.8), 0 0px 30px rgba(255, 0, 0, 0.6);
        }
        100% {
            text-shadow: 0 0px 5px rgba(233, 85, 189, 0.3);
        }
        }

        @-webkit-keyframes shine {
        0%, 10% {
            text-shadow: 0 0px 5px rgba(233, 85, 189, 0.3);
        }
        50% {
            text-shadow: 0 0px 20px rgba(233, 85, 189, 0.8), 0 0px 30px rgba(0, 255, 64, 0.6);
        }
        100% {
            text-shadow: 0 0px 5px rgba(85, 233, 105, 0.3);
        }
        }

        #button-container {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        opacity: 0;
        animation: fadeIn 1s ease-in forwards;
        animation-delay: 4s;

        from {

        }
        to {

        }

        font-size: 18px;
        font-family: 'Dancing Script', cursive;
        background: linear-gradient(135deg, #ff1515c2, #fa1e3f79);
        color: white;
        border: 2px solid white;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        transition: all 0.3s ease;
        }

        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
        }

<script>     
    window.requestAnimationFrame =
    window.__requestAnimationFrame ||
        window.requestAnimationFrame ||
        window.webkitRequestAnimationFrame ||
        window.mozRequestAnimationFrame ||
        window.oRequestAnimationFrame ||
        window.msRequestAnimationFrame ||
        (function () {
            return function (callback, element) {
                var lastTime = element.__lastTime;
                if (lastTime === undefined) {
                    lastTime = 0;
                }
                var currTime = Date.now();
                var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                window.setTimeout(callback, timeToCall);
                element.__lastTime = currTime + timeToCall;
            };
        })();
    window.isDevice = 
    (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent 
        || navigator.vendor || window.opera)).toLowerCase()));
    var loaded = false;
    var init = function () {
    if (loaded) return;
    loaded = true;
    var mobile = window.isDevice;
    var koef = mobile ? 1 : 1;
    var canvas = document.getElementById('heart');
    var ctx = canvas.getContext('2d');
    var width = canvas.width = koef * innerWidth;
    var height = canvas.height = koef * innerHeight;
    var rand = Math.random;
    ctx.fillStyle = "rgba(0,0,0,1)";
    ctx.fillRect(0, 0, width, height);

    var heartPosition = function (rad) {
        //return [Math.sin(rad), Math.cos(rad)];
        return [Math.pow(Math.sin(rad), 3), 
            -(15 * Math.cos(rad) - 5 * 
            Math.cos(2 * rad) - 2 * 
            Math.cos(3 * rad) - Math.cos(4 * rad))];
    };
    var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
        return [dx + pos[0] * sx, dy + pos[1] * sy];
    };

    window.addEventListener('resize', function () {
        width = canvas.width = koef * innerWidth;
        height = canvas.height = koef * innerHeight;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);
    });

    var traceCount = mobile ? 35 : 50;
    var pointsOrigin = [];
    var i;
    var dr = mobile ? 0.2 : 0.1;
    for (i = 0; i < Math.PI * 2; i += dr) 
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
    for (i = 0; i < Math.PI * 2; i += dr) 
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
    for (i = 0; i < Math.PI * 2; i += dr) 
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
    var heartPointsCount = pointsOrigin.length;

    var targetPoints = [];
    var pulse = function (kx, ky) {
        for (i = 0; i < pointsOrigin.length; i++) {
            targetPoints[i] = [];
            targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
            targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
        }
    };

    var e = [];
    for (i = 0; i < heartPointsCount; i++) {
        var x = rand() * width;
        var y = rand() * height;
        var colorChoice = rand() > 0.95 ? "rgba(255, 255, 255, 0.8)" : rand() > 0.96 ? "rgba(255, 100, 100, 0.9)" : "hsla(" + ~~(rand() * 30) + "," + ~~(50 * rand() + 70) + "%," + ~~(30 * rand() + 45) + "%,.6)";
        e[i] = {
            vx: 0,
            vy: 0,
            R: mobile ? 3 : 2,
            speed: rand() + 5,
            q: ~~(rand() * heartPointsCount),
            D: 2 * (i % 2) - 1,
            force: 0.2 * rand() + 0.7,
            f: colorChoice,
            trace: []
        };
        for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
    }

    var config = {
        traceK: 0.4,
        timeDelta: 0.01
    };

    var time = 0;
    var loop = function () {
        var n = -Math.cos(time);
        pulse((1 + n) * .5, (1 + n) * .5);
        time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
        ctx.fillStyle = mobile ? "rgba(0,0,0,.05)" : "rgba(0,0,0,.1)";
        ctx.fillRect(0, 0, width, height);
        for (i = e.length; i--;) {
            var u = e[i];
            var q = targetPoints[u.q];
            var dx = u.trace[0].x - q[0];
            var dy = u.trace[0].y - q[1];
            var length = Math.sqrt(dx * dx + dy * dy);
            if (10 > length) {
                if (0.95 < rand()) {
                    u.q = ~~(rand() * heartPointsCount);
                }
                else {
                    if (0.99 < rand()) {
                        u.D *= -1;
                    }
                    u.q += u.D;
                    u.q %= heartPointsCount;
                    if (0 > u.q) {
                        u.q += heartPointsCount;
                    }
                }
            }
            u.vx += -dx / length * u.speed;
            u.vy += -dy / length * u.speed;
            u.trace[0].x += u.vx;
            u.trace[0].y += u.vy;
            u.vx *= u.force;
            u.vy *= u.force;
            for (k = 0; k < u.trace.length - 1;) {
                var T = u.trace[k];
                var N = u.trace[++k];
                N.x -= config.traceK * (N.x - T.x);
                N.y -= config.traceK * (N.y - T.y);
            }
            ctx.fillStyle = u.f;
            for (k = 0; k < u.trace.length; k++) {
                var size = mobile ? 2 : 1;
                ctx.fillRect(u.trace[k].x, u.trace[k].y, size, size);
            }
        }

        window.requestAnimationFrame(loop, canvas);
    };
    loop();
    };
